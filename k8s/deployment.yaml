
apiVersion: apps/v1
kind: Deployment
metadata:
  name: attendance-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: attendance-app
  template:
    metadata:
      labels:
        app: attendance-app
    spec:
      containers:
        - name: attendance-app
          image: ramyagarla/attendance-app:latest
          ports:
            - containerPort: 5000
